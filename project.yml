name: Tape
options:
  bundleIdPrefix: dev.gustaf
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  TapeCore:
    path: Packages/TapeCore

settings:
  base:
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""

targets:
  Tape:
    type: application
    platform: macOS
    sources:
      - path: Sources
      # XcodeGen has no `resources` key; the asset catalog must be listed as a source.
      - path: Resources/Assets.xcassets
    dependencies:
      - package: TapeCore
    entitlements:
      path: Resources/Tape.entitlements
      properties:
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_NAME: Tape
        PRODUCT_BUNDLE_IDENTIFIER: dev.gustaf.tape
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Tape
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "26.0"
        LSUIElement: true
        NSHumanReadableCopyright: "Tape"
        # Written here rather than as INFOPLIST_KEY_*: NSAudioCaptureUsageDescription is reported to be dropped that way.
        NSMicrophoneUsageDescription: "Tape records your voice alongside the call."
        NSAudioCaptureUsageDescription: "Tape records what other people say in your calls."
    scheme: {}
